<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRAC 2</title>
</head>
<body>
  <main>
    <h1>Registration</h1>
    <form id="taskForm">
      <div>
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div>
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" />
      </div>

      <div>
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
      </div>

      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required />
      </div>

      <fieldset>
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="Male" checked /> Male</label>
        <label><input type="radio" name="gender" value="Female" /> Female</label>
        <label><input type="radio" name="gender" value="Other" /> Other</label>
      </fieldset>

      <div>
        <label for="dob">Date of Birth</label>
        <input id="dob" name="dob" type="date" />
      </div>

      <div>
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" />
      </div>

      <div>
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3"></textarea>
      </div>

      <div>
        <label for="occupation">Occupation</label>
        <select id="occupation" name="occupation">
          <option value="Student">Student</option>
          <option value="Teacher">Teacher</option>
          <option value="Professional">Professional</option>
        </select>
      </div>

      <fieldset>
        <legend>Skills (check at least one)</legend>
        <label><input type="checkbox" name="skills" value="Java" /> Java</label>
        <label><input type="checkbox" name="skills" value="JavaScript" /> JavaScript</label>
        <label><input type="checkbox" name="skills" value="Python" /> Python</label>
      </fieldset>

      <div>
        <label for="education">Education</label>
        <select id="education" name="education">
          <option value="HighSchool">High School</option>
          <option value="Bachelors">Bachelors</option>
          <option value="Masters">Masters</option>
        </select>
      </div>

      <div>
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="India">India</option>
          <option value="USA">USA</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label for="role">Role</label>
        <input id="role" name="role" type="text" />
      </div>

      <fieldset>
        <legend>Hobbies</legend>
        <label><input type="checkbox" name="hobbies" value="Reading" /> Reading</label>
        <label><input type="checkbox" name="hobbies" value="Travel" /> Travel</label>
        <label><input type="checkbox" name="hobbies" value="Gaming" /> Gaming</label>
      </fieldset>

      <div>
        <button type="submit">Register</button>
      </div>
    </form>
  </main>

  <script src="task.js"></script>
</body>
</html>
